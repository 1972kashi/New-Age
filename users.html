<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>New Age Automotive — Users</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="users.css"/>
<link rel="stylesheet" href="reveal.css"/>
<link rel="stylesheet" href="media-overrides.css"/>

</head>
<body>
<nav class="nav">
  <div class="nav-brand">NEW AGE <span>AUTOMOTIVE</span></div>
  <div class="nav-links">
    <a class="nav-btn " href="admin-upload.html">Upload</a>
    <a class="nav-btn active" href="users.html">Users</a>
    <a class="nav-btn" href="login.html">Dealers</a>
    <a class="nav-btn" href="car-detail-upload.html">Car Details</a>
  </div>
  <div class="nav-user">
    Logged in as <strong id="nav-name">Admin</strong>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">User <span>Management</span></div>
      <div class="guest-note" id="guest-note"></div>
    </div>
    <button class="btn-primary" id="add-user-btn" onclick="openAddModal()">+ Add User</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Users</div>
      <div class="stat-val gold" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Admins</div>
      <div class="stat-val" id="stat-admin">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Regular Users</div>
      <div class="stat-val green" id="stat-users">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This Month</div>
      <div class="stat-val" id="stat-month">0</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search name, email, phone..." oninput="renderTable()"/>
      </div>
      <select class="filter-sel" id="role-filter" title="Filter by role" onchange="renderTable()">
        <option value="">All Roles</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>

   <div class="table-card faq-manager-card">
    <div class="page-title faq-manager-title">FAQ <span>Manager</span></div>
    <div class="row2 faq-form-row">
      <div class="field">
        <label>Question</label>
        <input type="text" id="faq-question" placeholder="Enter a frequently asked question" />
      </div>
      <div class="field">
        <label>Category</label>
        <select id="faq-category" title="FAQ category">
          <option value="general">General</option>
          <option value="payment">Payment</option>
          <option value="financing">Financing</option>
          <option value="buying">Buying a Car</option>
          <option value="selling">Selling a Car</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Answer</label>
      <textarea id="faq-answer" rows="4" placeholder="Enter the answer that should appear on the FAQ page"></textarea>
    </div>
    <div class="faq-actions">
      <button class="btn-save" onclick="saveFaqForm()">Save FAQ</button>
      <button class="btn-cancel" id="cancel-faq-edit-btn" type="button" onclick="cancelFaqEdit()" style="display:none">Cancel</button>
    </div>
    <div class="faq-list-section">
      <div class="guest-note" id="faq-count">0 entries</div>
      <div id="faq-list"></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="user-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add New User</div>
    <div class="row2">
      <div class="field"><label>First Name</label><input type="text" id="m-fname" placeholder="John"/></div>
      <div class="field"><label>Last Name</label><input type="text" id="m-lname" placeholder="Doe"/></div>
    </div>
    <div class="field"><label>Email Address</label><input type="email" id="m-email" placeholder="user@email.com"/></div>
    <div class="field"><label>Phone Number</label><input type="tel" id="m-phone" placeholder="+254 7XX XXX XXX"/></div>
    <div class="field"><label>Role</label>
      <select id="m-role" title="Select user role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="field" id="m-pass-field"><label>Password</label><input type="password" id="m-pass" placeholder="Min 8 characters"/></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveUser()">Save User</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="overlay" id="del-overlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">Delete User?</div>
    <div class="confirm-msg" id="del-msg">This action cannot be undone.</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeDelModal()">Cancel</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="users.js"></script>
<script src="reveal-common.js"></script>
</body>
</html>
